name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build plugin, resource pack and tests
        run: ./gradlew --no-daemon build
      - name: Upload plugin and resource pack
        uses: actions/upload-artifact@v4
        with:
          name: ForgeSystem-${{ github.sha }}
          path: |
            build/libs/*.jar
            src/main/resources/forge.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 14
